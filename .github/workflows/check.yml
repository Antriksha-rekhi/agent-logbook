name: Check

# pull_request (not pull_request_target): forks run with a read-only token and no secrets.
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # Actions pinned to exact commits (v4) so a moved tag cannot change what runs.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 20

      - name: Syntax
        run: for f in *.js media/*.js; do node --check "$f" || exit 1; done

      - name: Source rules
        # Fails on never-allowed patterns; flags sensitive files and new long lines for review.
        env:
          BASE: ${{ github.event_name == 'pull_request' && format('origin/{0}', github.base_ref) || github.event.before }}
        run: |
          if ! git cat-file -e "$BASE^{commit}" 2>/dev/null; then BASE=""; fi
          node .github/check.js $BASE

      - name: Packages
        run: npx --yes @vscode/vsce@3 package --out /tmp/agent-logbook.vsix
